[program:energywam-wandb]
directory=/root/zzc/energyWAM
command=/root/zzc/energyWAM/.venv-wandb/bin/python -u scripts/watch_wandb.py
environment=CUDA_VISIBLE_DEVICES="",WANDB_CONSOLE="off",WANDB_DISABLE_CODE="true",OMP_NUM_THREADS="1",HTTP_PROXY="http://127.0.0.1:7901",HTTPS_PROXY="http://127.0.0.1:7901",http_proxy="http://127.0.0.1:7901",https_proxy="http://127.0.0.1:7901",NO_PROXY="localhost,127.0.0.1,::1",no_proxy="localhost,127.0.0.1,::1"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/root/zzc/energyWAM/logs/wandb_bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
