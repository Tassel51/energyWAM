[program:energywam-gpu23]
directory=/root/zzc/energyWAM
command=/usr/local/miniconda3/envs/py312/bin/python -u scripts/run_gpu23_formal.py
environment=CUDA_VISIBLE_DEVICES="2,3",OMP_NUM_THREADS="4",MKL_NUM_THREADS="4",PYTHONPATH="/root/zzc/energyWAM",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True",ENERGYWAM_ALLOW_GPU_TRAINING="1",TOKENIZERS_PARALLELISM="false"
autostart=false
autorestart=false
exitcodes=0
startsecs=10
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/root/zzc/energyWAM/logs/gpu23_formal_pipeline.log
redirect_stderr=true
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
