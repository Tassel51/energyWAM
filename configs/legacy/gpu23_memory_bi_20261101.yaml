run_id: energywam_gpu23_bi_20261101
notes: 'First bounded real-data training: 200 Stage-I bi steps then 100 Stage-II joint
  steps. 50-task RoboCasa365 target/human, full train split loader, 150k-window train-only
  subset statistics. Pretrained Qwen3-VL-4B language trunk fully trained; vision and
  DINO frozen. K=2 full second-order unroll, bf16 backbone/fp32 candidates, eager
  attention, no LoRA. One model and optimizer, batch 2, language layers split 18/18
  across physical GPUs 2 and 3 (visible 0/1); Non-reentrant activation recomputation;
  hybrid saved activations with per-visible-GPU budgets 16/19 GiB, resident parameter
  views, and preallocated zero 8-bit AdamW moments. Full K=2 unroll and higher-order
  derivatives retained. Capacity tested on longest training instruction. Rolling checkpoint
  every 10 steps. Initial engineering budget, not a claim of convergence. Stage-I
  LR 1e-5, warmup 20.'
backbone:
