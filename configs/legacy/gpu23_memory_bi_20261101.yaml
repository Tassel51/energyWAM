  freeze_dino: true
  dino_image_size: 224
  dino_patch_size: 16
  dino_hidden_dim: 384
  dino_num_special_tokens: 5
  dino_num_patches: 196
  gradient_checkpointing: true
data:
  action_dim: 12
  state_dim: 32
  action_horizon: 16
  num_future_frames: 3
