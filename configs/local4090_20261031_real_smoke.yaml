run_id: energywam_local4090_real_smoke_20261031
notes: >
  REAL smoke on this 4x4090 server: 2 training steps with the pretrained
  Qwen3-VL-4B + frozen DINOv3 on the merged 50-task target view, to verify the
  double backward (K=2 full second-order) and token injection on actual weights
  under torch 2.13 / transformers 4.57 / eager attention / bf16 backbone.
  NOT a training run.  Stats: 256-window smoke subset bundle (explicitly
  labeled subset).

backbone:
  backend: qwen3vl
  base_vlm: /datasets/models/Qwen3-VL-4B-Instruct
  attn_implementation: eager
  dtype: bfloat16
  freeze_qwen_vision: true
  tune_language_model: true
  tune_qwen_vision: false
  lora_enabled: false
  dino_path: /datasets/models/dinov3-vits16-pretrain-lvd1689m
  freeze_dino: true
  dino_image_size: 224
  dino_patch_size: 16
  dino_hidden_dim: 384
  dino_num_special_tokens: 5
  dino_num_patches: 196

data:
  # RoboCasa365 PandaOmron contract: action 12d, raw state 16d -> sincos 32d,
  # horizon 16, first version: LEFT camera only (robot0_agentview_left).
  action_dim: 12
  state_dim: 32
  action_horizon: 16
  num_future_frames: 3
  future_offset_rule: uniform_within_action_horizon
  future_offsets: [5, 11, 16]
  num_cameras: 1
  future_camera_index: 0
  camera_order: ["robot0_agentview_left"]
  normalization_profile: paper_standardized_v1
  action_normalization: zscore
  standardization_epsilon: 1.0e-6
  norm_stats_bundle_path: stats/trainmix_smoke256_paper_standardized_v1.json
  state_normalization: sincos
  require_full_horizon: true
  dino_preprocess_version: dino_v3_vits16_224_center_norm_v1
  data_root_dir: /datasets/robocasa365_trainmix
  data_mix: robocasa365_target_50tasks
  dataset_py: lerobot_datasets
  obs_image_size: [224, 224]
  include_state: true

solver:
  unroll_mode: full
  train_inner_steps: 2
  eval_inner_steps: 2
  alpha_action: 0.05
  alpha_future: 0.05
  joint_update_mode: simultaneous
  clip_action_grad: null
  clip_future_grad: null
  action_clamp_min: null
  action_clamp_max: null
  future_clamp_min: null
  future_clamp_max: null

init:
  initialization_action: normal
  initialization_future: normal
  init_action_std: 1.0
  init_future_std: 1.0
  init_action_mean: 0.0
  init_future_mean: 0.0

loss:
  action_loss: masked_mse
  future_loss: masked_mse
  lambda_action: 1.0
  lambda_future: 1.0
  beta_action: 1.0
  beta_future: 1.0
  future_cosine_weight: 0.0

stage:
  stage: bi
  bi_both_directions_each_batch: true
  joint_use_bi_aux: false
  joint_bi_aux_weight: 0.0

trainer:
  seed: 42
  max_train_steps: 2
  per_device_batch_size: 1
  optimizer: adamw8bit
  learning_rate: 1.0e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_steps: 100
  logging_frequency: 1
  save_interval: 1000
  output_dir: logs/runs/energywam_local4090_real_smoke_20261031
  device: cuda
  candidate_dtype: float32
  offload_saved_tensors: true

framework:
  name: QwenEnergyWAM
  energy_head_hidden: 256
  energy_head_dropout: 0.0
  num_state_tokens: 1
  use_learned_future_placeholder: true
